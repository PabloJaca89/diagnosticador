name: Actualizar diagnosticador

on:
  schedule:
    # 22:30 hora peninsular todos los días: 21:30 UTC en invierno y 20:30 UTC en verano.
    # Se programan las dos y solo sigue adelante la que cae a las 22 h de Madrid.
    - cron: "30 20 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar la hora de Madrid
        id: hora
        run: |
          Z=$(TZ=Europe/Madrid date +%z)
          P="${{ github.event.schedule }}"
          echo "Hora en Madrid: $(TZ=Europe/Madrid date +%H:%M) (UTC$Z) · programación: $P"
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$Z" = "+0100" ] && [ "$P" = "30 21 * * *" ]; } \
             || { [ "$Z" = "+0200" ] && [ "$P" = "30 20 * * *" ]; }; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'si'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'si'
        with:
          python-version: "3.12"

      - name: Instalar librerías
        if: steps.hora.outputs.seguir == 'si'
        run: pip install pandas numpy requests xlrd

      - name: Ejecutar diagnosticador
        if: steps.hora.outputs.seguir == 'si'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python diagnosticador.py

      - name: Guardar resultados
        if: steps.hora.outputs.seguir == 'si'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          if [ -d datos ]; then git add datos; fi
          git commit -m "Actualización $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
