name: Actualizar diagnosticador

on:
  schedule:
    - cron: "17 6 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install pandas numpy requests xlrd

      - name: Ejecutar diagnosticador
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python diagnosticador.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs datos || true
          git commit -m "Actualización $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
