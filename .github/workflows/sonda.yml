name: Sonda de fuentes (temporal)
on:
  push:
    branches: [sonda-fuentes]
    paths: [sonda/sonda.py, .github/workflows/sonda.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sonda/sonda.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sonda/salida sonda/salida2
          git commit -m "Resultado de la sonda" || echo "Sin cambios"
          git push
